version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: legacy_mod_postgres
    restart: always
    environment:
      POSTGRES_DB: legacy_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d legacy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
